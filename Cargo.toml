[package]
name = "ripper"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "rip"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.37"
percent-encoding = "2.3.2"
rustix = { version = "1.1.5", features = ["fs", "process"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
