name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GARRET_SUBSTITUTER: https://cache.jeiang.dev
  GARRET_PUBLIC_KEY: "cache.jeiang.dev-1:owXJK5/UX9NSf1lhmDDT3QTxMtbVk9YfHhjvOXyPhpA="

jobs:
  lint:
    name: lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
      - name: Lints and formatting
        run: nix develop --command just check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
      - name: Build the package (runs the unit tests)
        run: nix build --print-build-logs
      - name: Wrapper and completions
        run: |
          ./result/bin/rip --version
          test -s result/share/fish/vendor_completions.d/rip.fish
          test -s result/share/bash-completion/completions/rip.bash
          test -s result/share/zsh/site-functions/_rip

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}
      # ubuntu-24.04 blocks unprivileged user namespaces through AppArmor, and a
      # bwrap from /nix/store has no AppArmor profile. The sandbox harness's own
      # preflight (tests/common/mod.rs) would otherwise fail every test here.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # A real btrfs, so the subvolume tests run here as they do on artemis.
      - name: Scratch btrfs
        run: |
          truncate -s 1G "$RUNNER_TEMP/btrfs.img"
          nix develop --command mkfs.btrfs -q "$RUNNER_TEMP/btrfs.img"
          sudo mkdir -p /mnt/btrfs
          sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /mnt/btrfs
          sudo chown "$(id -u):$(id -g)" /mnt/btrfs
          echo "RIP_TEST_BTRFS=/mnt/btrfs" >> "$GITHUB_ENV"
      - name: Tests
        run: nix develop --command just test

  # Runs only after every check passed on a push to main, so the cache never
  # holds outputs of a commit that failed CI. Nothing depends on this job.
  push:
    name: push to garret
    needs: [lint, build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged for a short-lived push token; the server only grants push
      # to the ref_patterns configured for this repo (see below).
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = ${{ env.GARRET_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ env.GARRET_PUBLIC_KEY }}

      - name: Build the default package
        run: nix build .#default --print-build-logs

      - name: Build the static binary
        run: nix build .#static -o result-static --print-build-logs

      # The dev shell's closure (the Rust toolchain and tools) as a GC root,
      # so the next CI run and `nix develop` on other hosts substitute it.
      - name: Realize the dev shell
        run: nix develop --profile toolchain --command true

      # garret admits a GitHub OIDC push only when the token's repository_id,
      # event_name, job_workflow_ref and ref all match the github-actions
      # issuer in cornn-flaek modules/garret/default.nix. It must list this
      # repo and "jeiang/ripper/.github/workflows/ci.yml@refs/heads/main",
      # or the push below is rejected server-side. The script installs the
      # pinned garret client itself.
      - name: Push the closures to garret
        run: .ci/garret-push.sh ./result ./result-static ./toolchain
